name: Weekly database backup

on:
  schedule:
    - cron: "0 16 * * 0" # Sunday 16:00 UTC = Monday 2am Brisbane
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          pg_dump "$DATABASE_URL" --schema=public --no-owner --no-privileges \
            --file=backup/public-$(date +%F).sql
          pg_dump "$DATABASE_URL" --data-only --schema=storage --table=storage.objects \
            --file=backup/storage-objects-$(date +%F).sql

      - name: Upload backup
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
